<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Sphere</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

   <div class=" signin-cont p-4 border border-light rounded-5 border-5">
        <form action="">

            <h1 class="text-info text-center mt-4">SIGN-IN</h1>
            <h5 class="text-info text-center fw-light fst-italic fs-6">(SignIn to Link Sphere to discover more..)</h5>

            <div class="mt-5">
                <label for="" class="text-light">Username</label>
                <i class="fa-solid fa-user text-light ms-2"></i>
                <input type="text" placeholder="username" class="form-control mt-3">
            </div>

            <div class="mt-4">
                <label for="" class="text-light">Password</label>
                <i class="fa-solid fa-lock text-light ms-2"></i>
                <input type="password" placeholder="password" class="form-control mt-3">
            </div>

            <div class="text-center mt-3 login"><button class="btn btn-primary"> <a href="/login_page"></a>Login</button></div>

        </form>

        <div class="mt-5"> <a href="">Forgot Password?</a> </div>
        <div class="mt-2 text-light">New User? <a href="/sign_up/">Sign-up</a> </div>

   </div>
</body>
</html>
