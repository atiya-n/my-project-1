<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Sphere</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class=" signin-cont p-4  border-light rounded-5">
        <form action="">

            <h1 class="text-white text-center mt-4 fst-italic display-3 fw-semibold">Link Sphere</h1>
            <h5 class="text-info text-center fw-light fs-6">Lets get started!</h5>

            <div class="mt-5 mb-4">
                <label for="" class="text-light">Email</label>
                <i class="fa-solid fa-envelope text-light ms-2"></i>
                <input type="email" placeholder="email" class="form-control mt-3">
            </div>

            <div class="mt-3 d-flex">
                <label for="" class="text-light">First Name</label>
                <input type="text" placeholder="first name" class="ms-2 rounded-2 border border-light">

                <label for="" class="text-light ms-3">Last Name</label>
                <input type="text" placeholder="last name" class="ms-2 rounded-2 border border-light">
            </div>

            <div class="mt-3">
                <label for="" class="text-light">Password</label>
                <i class="fa-solid fa-lock text-light ms-2"></i>
                <input type="password" placeholder="password" class="form-control mt-1">
            </div>

             <div class="mt-3">
                <label for="" class="text-light">Confirm password :</label>
                <input type="password" placeholder="confirm password" class="form-control mt-1">
            </div>

            <div class="text-center mt-4 register"><button class="btn btn-primary "><a href="/login_page/"></a>Register</button></div>

        </form>

        <p class="text-light text-center mt-2">Don't have Link Sphere yet? You're missing out!</p>
        <p class="text-light text-center">Already have an account? <a href="/sign_in/">Sign-in</a></p>


    </div>
</body>

</html>
